  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --bg-base: #0c0f14;
      --bg-surface: #141922;
      --bg-surface-elevated: #1b222e;
      --bg-card: #161d28;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(212, 175, 55, 0.35);
      --text-main: #f0f3f8;
      --text-muted: #94a3b8;
      --text-subtle: #64748b;
      --gold-primary: #d4af37;
      --gold-hover: #f3cf65;
      --gold-soft: rgba(212, 175, 55, 0.12);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-card: 0 12px 30px -6px rgba(0, 0, 0, 0.6);
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 100px;
    }
    a { color: inherit; text-decoration: none; }

    .top-bar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(12, 15, 20, 0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 14px 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 1.15rem; }
    .brand-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--gold-primary), #9a781b);
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
      color: #0c0f14; font-weight: 800; font-size: 1rem;
    }
    .nav-center { display: flex; align-items: center; gap: 10px; overflow-x: auto; max-width: 55%; }
    .nav-pill {
      font-size: 0.8rem; font-weight: 600; padding: 6px 14px; border-radius: 20px;
      background: var(--bg-surface-elevated); color: var(--text-muted);
      border: 1px solid var(--border-subtle); white-space: nowrap; transition: var(--transition);
    }
    .nav-pill:hover { color: var(--gold-hover); border-color: var(--gold-primary); background: var(--gold-soft); }

    .nav-right { display: flex; align-items: center; gap: 10px; }
    .lang-switcher {
      display: inline-flex; align-items: center;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 20px; padding: 2px;
    }
    .lang-btn {
      background: transparent; border: none; color: var(--text-muted);
      padding: 5px 11px; border-radius: 16px; font-size: 0.78rem; font-weight: 700;
      cursor: pointer; transition: var(--transition); font-family: inherit;
    }
    .lang-btn.active { background: var(--gold-primary); color: #0c0f14; }

    .btn-back {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 16px; border-radius: 30px; font-size: 0.82rem; font-weight: 600;
      border: 1px solid var(--border-subtle); color: var(--text-muted); transition: var(--transition);
      cursor: pointer; background: transparent; font-family: inherit;
    }
    .btn-back:hover { border-color: var(--gold-primary); color: #fff; }

    .hero-banner {
      position: relative;
      background: radial-gradient(circle at 50% 25%, #1c2436 0%, #0c0f14 85%);
      border-bottom: 1px solid var(--border-subtle);
      padding: 75px 24px 60px; text-align: center;
    }
    .hero-subtitle {
      text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.25em;
      color: var(--gold-primary); font-weight: 600; margin-bottom: 12px;
    }
    .hero-title {
      font-family: 'Playfair Display', serif; font-size: clamp(2.3rem, 5vw, 3.8rem);
      font-weight: 700; color: #fff; margin-bottom: 16px; line-height: 1.2;
    }
    .hero-desc { max-width: 820px; margin: 0 auto; color: var(--text-muted); font-size: 1.05rem; }

    .container { max-width: 1040px; margin: 50px auto 0; padding: 0 20px; }

    .tradition-block {
      background: var(--bg-surface); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg); padding: 44px 40px; margin-bottom: 60px;
      scroll-margin-top: 90px; position: relative; box-shadow: var(--shadow-card);
    }
    .tradition-block::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
      background: linear-gradient(to bottom, var(--theme-color, var(--gold-primary)), transparent);
    }

    .theme-vipassana { --theme-color: #38bdf8; }
    .theme-zen { --theme-color: #94a3b8; }
    .theme-advaita { --theme-color: #d4af37; }
    .theme-dzogchen { --theme-color: #a855f7; }
    .theme-yoga { --theme-color: #10b981; }

    .tradition-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      flex-wrap: wrap; gap: 14px; margin-bottom: 24px; border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 20px;
    }
    .tradition-title-area h2 {
      font-family: 'Playfair Display', serif; font-size: 2.1rem; color: #fff; line-height: 1.2; margin-bottom: 6px;
    }
    .tradition-origin { font-size: 0.85rem; color: var(--text-subtle); font-weight: 500; }
    .badges-wrap { display: flex; gap: 8px; flex-wrap: wrap; }
    .tradition-badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px;
      border-radius: 20px; font-size: 0.78rem; font-weight: 600;
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-subtle); color: var(--text-main);
    }
    .tradition-badge.buddha-yes { border-color: rgba(56, 189, 248, 0.35); color: #38bdf8; }
    .tradition-badge.buddha-no { border-color: rgba(212, 175, 55, 0.35); color: var(--gold-hover); }

    .tradition-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px; margin-top: 20px;
    }
    .grid-box {
      background: var(--bg-card); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md); padding: 22px;
    }
    .grid-box h3 {
      font-size: 0.88rem; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--gold-hover); margin-bottom: 10px;
    }
    .grid-box p { font-size: 0.92rem; color: var(--text-muted); line-height: 1.65; }

    .quote-box {
      margin-top: 24px; padding: 18px 24px; border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.02);
      border-left: 3px solid var(--theme-color, var(--gold-primary));
      font-style: italic; color: #e2e8f0; font-size: 0.98rem;
    }

    /* Philosophische Vertiefung */
    .insights-section {
      background: var(--bg-surface); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg); padding: 40px 36px; margin-bottom: 50px;
      box-shadow: var(--shadow-card);
    }
    .insights-header { text-align: center; margin-bottom: 28px; }
    .insights-tag {
      text-transform: uppercase; font-size: 0.78rem; letter-spacing: 0.18em;
      color: var(--gold-primary); font-weight: 700; margin-bottom: 8px; display: block;
    }
    .insights-title { font-family: 'Playfair Display', serif; font-size: 1.9rem; color: #fff; }
    .insights-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;
    }
    .insight-card {
      background: var(--bg-card); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md); padding: 22px; display: flex; flex-direction: column;
    }
    .insight-card h4 {
      color: var(--gold-hover); font-size: 1.05rem; margin-bottom: 10px; line-height: 1.35;
    }
    .insight-card p {
      font-size: 0.9rem; color: var(--text-muted); line-height: 1.65;
    }
    .insight-quote {
      margin-top: auto; padding-top: 14px; font-style: italic; font-size: 0.85rem;
      color: #cbd5e1; border-top: 1px solid var(--border-subtle);
    }

    /* Synthese */
    .synthesis-section {
      background: var(--bg-surface); border: 1px solid var(--border-accent);
      border-radius: var(--radius-lg); padding: 44px 36px; box-shadow: var(--shadow-card);
      margin-bottom: 40px;
    }
    .synthesis-title {
      font-family: 'Playfair Display', serif; font-size: 2.2rem; color: #fff;
      text-align: center; margin-bottom: 12px;
    }
    .synthesis-intro {
      text-align: center; max-width: 800px; margin: 0 auto 36px;
      color: var(--text-muted); font-size: 1rem;
    }
    .comparison-table-wrap {
      overflow-x: auto; border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md); background: var(--bg-card);
    }
    .comparison-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.88rem; }
    .comparison-table th, .comparison-table td {
      padding: 16px 18px; border-bottom: 1px solid var(--border-subtle); vertical-align: top;
    }
    .comparison-table th {
      background: var(--bg-surface-elevated); color: var(--gold-primary);
      font-weight: 700; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.08em;
    }
    .comparison-table tr:hover td { background: rgba(255, 255, 255, 0.015); }
    .comparison-table td strong { color: #fff; display: block; margin-bottom: 4px; }

    .overlaps-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px; margin-top: 36px;
    }
    .overlap-card {
      background: var(--bg-card); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md); padding: 22px;
    }
    .overlap-card h4 { color: var(--gold-primary); font-size: 1.05rem; margin-bottom: 8px; }
    .overlap-card p { font-size: 0.9rem; color: var(--text-muted); line-height: 1.6; }

    @media (max-width: 768px) {
      .tradition-block, .insights-section, .synthesis-section { padding: 26px 18px; }
      .nav-center { display: none; }
    }
  </style>
</head>

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem("app_lang", lang);
      document.documentElement.lang = lang;

      document.getElementById("btnDE").classList.toggle("active", lang === "de");
      document.getElementById("btnFR").classList.toggle("active", lang === "fr");

      const t = content[lang];
      document.getElementById("brandLabel").innerText = t.brand;
      document.getElementById("navInsights").innerText = t.navInsights;
      document.getElementById("navSynthese").innerText = t.syntheseNav;
      document.getElementById("backToMediathek").innerText = t.backBtn;
      document.getElementById("heroSub").innerText = t.heroSub;
      document.getElementById("heroTitle").innerText = t.heroTitle;
      document.getElementById("heroDesc").innerText = t.heroDesc;

      renderPage();
    }

      const t = content[currentLang];
      const area = document.getElementById("contentArea");

      let html = "";

      // 5 Traditionen rendern
      t.sections.forEach(sec => {
        html += `
          <article class="tradition-block ${sec.cls}" id="${sec.id}">
            <div class="tradition-header">
              <div class="tradition-title-area">
                <h2>${sec.title}</h2>
                <span class="tradition-origin">${sec.origin}</span>
              </div>
              <div class="badges-wrap">
                <div class="tradition-badge ${sec.buddhaClass}">${sec.buddhaBadge}</div>
                <div class="tradition-badge">${sec.badge}</div>
              </div>
            </div>
            <div class="tradition-grid">
              <div class="grid-box">
                <h3>${t.hOrigin}</h3>
                <p>${sec.p1}</p>
              </div>
              <div class="grid-box">
                <h3>${t.hPhil}</h3>
                <p>${sec.p2}</p>
              </div>
              <div class="grid-box">
                <h3>${t.hPrac}</h3>
                <p>${sec.p3}</p>
              </div>
              <div class="grid-box">
                <h3>${t.hTexts}</h3>
                <p>${sec.p4}</p>
              </div>
              <div class="grid-box" style="grid-column: 1 / -1; background: rgba(255, 255, 255, 0.02); border-color: rgba(212, 175, 55, 0.2);">
                <h3 style="color: var(--gold-primary);">${t.hBuddhaRel}</h3>
                <p>${sec.buddhaRel}</p>
              </div>
            </div>
            <div class="quote-box">${sec.quote}</div>
          </article>
        `;
      });

      // Vertiefung
      html += `
        <section class="insights-section" id="insights">
          <div class="insights-header">
            <span class="insights-tag">${t.insTag}</span>
            <h3 class="insights-title">${t.insTitle}</h3>
          </div>
          <div class="insights-grid">
            ${t.insCards.map(c => `
              <div class="insight-card">
                <h4>${c.t}</h4>
                <p>${c.p}</p>
                <div class="insight-quote">${c.q}</div>
              </div>
            `).join('')}
          </div>
        </section>
      `;

      // Synthese-Tabelle & Matrix
      html += `
        <section class="synthesis-section" id="synthese">
          <h2 class="synthesis-title">${t.synTitle}</h2>
          <p class="synthesis-intro">${t.synIntro}</p>
